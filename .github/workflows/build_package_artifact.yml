name: Build and Package Artifact

on:
  pull_request:
    branches: [ master, release/* ]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-and-package-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install prerequisites
        run: scripts/install-prerequisites.sh

      - name: Configure CMake
        run: |
          cmake -B build -GNinja \
            -DLV_BUILD_USE_KCONFIG=ON \
            -DLV_BUILD_DEFCONFIG_PATH=configs/defconfigs/linux.defconfig \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/out/install

      - name: Build
        run: |
          cmake --build build --parallel
          cmake --install build

      - name: Stage outputs in out folder
        run: |
          mkdir -p out
          cp -a build out/build
          test -d out/install

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: lvgl-build-linux
          path: out
          if-no-files-found: error

  build-and-package-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install prerequisites
        run: scripts\install-prerequisites.bat

      - name: Configure CMake
        run: |
          cmake -S . -B build/windows-base \
            -G "Visual Studio 17 2022" \
            -A x64 \
            -DBUILD_SHARED_LIBS=ON \
            -DLV_BUILD_USE_KCONFIG=ON \
            -DLV_BUILD_DEFCONFIG_PATH=configs/defconfigs/empty.defconfig \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/build/install/windows-base

      - name: Build
        run: cmake --build --preset windows-base_rel

      - name: Install
        run: cmake --install build/windows-base --config Release

      - name: Stage outputs in out folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path out -Force | Out-Null
          Copy-Item -Recurse -Force build/windows-base out/build
          Copy-Item -Recurse -Force build/install/windows-base out/install

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: lvgl-build-windows
          path: out
          if-no-files-found: error
